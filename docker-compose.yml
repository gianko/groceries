# Pantry's service definition for the household Pi's OMV Compose plugin
# stack. CHANGE_TO_COMPOSE_DATA_PATH is OMV's own placeholder — the Compose
# plugin substitutes it with this project's per-stack data folder when the
# stack is created/edited through its GUI.
services:
  # Single long-running process for the whole system, per #52 — serves the
  # web app and, at its own startup, registers the nightly DB-snapshot cron
  # (the only remaining scheduled job; the Expiry Digest is pull, not push,
  # per #47). Direct DB access via the /data volume.
  pantry-web:
    build:
      context: .
      dockerfile: Dockerfile.web
      # arm64 is the only target that matters on the Pi; buildx handles the
      # cross-build when developing on another architecture.
      platforms:
        - linux/arm64
    image: pantry-web:latest
    container_name: pantry-web
    environment:
      - TZ=Europe/Dublin
      - DB_PATH=/data/pantry.db
      - HEARTBEAT_PATH=/data/heartbeat
      - SNAPSHOT_PATH=/data/pantry.snapshot.db
    env_file:
      - .env
    volumes:
      # Bind mount, not a named volume, so the existing OMV backup routine
      # can see the snapshot file directly on the host filesystem.
      - CHANGE_TO_COMPOSE_DATA_PATH/data:/data
    restart: unless-stopped

  # Named Cloudflare Tunnel fronting pantry-web with a CA-signed HTTPS URL,
  # per #22. Token comes from the tunnel's Zero Trust dashboard config,
  # which maps the public hostname to http://pantry-web:4321 inside the
  # tunnel itself — no ports opened on this host.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pantry-cloudflared
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - pantry-web
